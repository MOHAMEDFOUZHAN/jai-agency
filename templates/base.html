<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Sales Demo{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
        integrity="sha512-SnH5WK+bZxgPHs44uWIX+LLJAJ9/2PkPKZ5QiAj6Ta86w+fsb2TkcmfRyVX3pBnMFcV7oQPJkl9QevSCWr3W6A=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>

<body>
    <div class="print-only-header">
        <h1>KOKKALATTY TEEA TRADERS</h1>
    </div>
    <div class="material-bg"></div>
    {% block content %}{% endblock %}

    <script>
        // Simple Interaction Scripts
        document.querySelectorAll('a, button').forEach(el => {
            el.addEventListener('mousedown', () => el.style.transform = 'scale(0.98)');
            el.addEventListener('mouseup', () => el.style.transform = 'scale(1)');
            el.addEventListener('mouseleave', () => el.style.transform = '');
        });
    </script>
    {% block scripts %}{% endblock %}
</body>

</html>
