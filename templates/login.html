{% extends "base.html" %}

{% block title %}Login | JAI AGENCIES{% endblock %}

{% block content %}
<style>
    /* Hide the base header, navbar, and global footer on login page to maintain focus */
    /* Hide the base header, navbar, and global footer on login page to maintain focus */
    .print-only-header, .navbar, .site-footer { display: none !important; }
    
    .login-container {
        height: 100vh;
        width: 100vw;
        display: flex;
        align-items: center;
        justify-content: center;
        perspective: 2000px;
        position: relative;
        z-index: 10;
    }

    .login-card {
        background: white;
        border-radius: 32px;
        padding: 2.5rem;
        width: 100%;
        max-width: 440px;
        box-shadow: 0 40px 100px -20px rgba(0, 0, 0, 0.5);
        transform-style: preserve-3d;
        text-align: center;
        border: 1px solid rgba(255, 255, 255, 0.1);
        animation: cardAppear 0.8s cubic-bezier(0.16, 1, 0.3, 1);
    }

    @keyframes cardAppear {
        from { opacity: 0; transform: translateY(40px) scale(0.95); }
        to { opacity: 1; transform: translateY(0) scale(1); }
    }

    .login-branding { margin-bottom: 2rem; }

    .login-logo-pnl {
        width: 72px;
        height: 72px;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 20px;
        display: flex;
        align-items: center;
        justify-content: center;
        margin: 0 auto 1.5rem;
        box-shadow: 0 8px 16px rgba(0,0,0,0.05);
    }

    .login-logo-pnl img { width: 42px; height: 42px; object-fit: contain; }

    .login-title {
        font-family: 'Space Grotesk', sans-serif;
        font-size: 2.25rem;
        font-weight: 800;
        color: #0f172a;
        margin-bottom: 0.5rem;
        line-height: 1;
    }

    .login-subtitle {
        color: #64748b;
        font-size: 0.85rem;
        font-weight: 800;
        text-transform: uppercase;
        letter-spacing: 0.15em;
    }

    .form-control-group { margin-bottom: 1.5rem; text-align: left; }

    .input-wrapper { position: relative; }
    .input-wrapper i {
        position: absolute;
        left: 20px;
        top: 50%;
        transform: translateY(-50%);
        color: #94a3b8;
        font-size: 1rem;
    }

    .form-input {
        width: 100%;
        height: 52px;
        padding-left: 56px !important;
        background: #f8fafc;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        font-family: 'Manrope', sans-serif;
        font-size: 1rem;
        font-weight: 600;
        color: #0f172a;
        transition: all 0.3s ease;
    }

    .form-input:focus {
        background: white;
        border-color: #3b82f6;
        box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1);
        outline: none;
    }

    .btn-authenticate {
        background: #1e293b;
        color: white;
        width: 100%;
        height: 52px;
        border-radius: 16px;
        border: none;
        font-size: 0.95rem;
        font-weight: 800;
        letter-spacing: 0.05em;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        transition: all 0.3s ease;
        margin-top: 1rem;
        box-shadow: 0 10px 20px -5px rgba(15, 23, 42, 0.4);
    }

    .btn-authenticate:hover {
        background: #0f172a;
        transform: translateY(-2px);
        box-shadow: 0 15px 30px -5px rgba(15, 23, 42, 0.6);
    }

    .login-footer {
        margin-top: 2rem;
        padding-top: 1.5rem;
        border-top: 1px solid #f1f5f9;
    }

    .login-footer p {
        font-size: 0.7rem;
        font-weight: 800;
        color: #94a3b8;
        text-transform: uppercase;
        letter-spacing: 0.1em;
        margin-bottom: 6px;
    }

    .login-footer p {
        font-size: 0.65rem;
        font-weight: 800;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 0.1em;
        opacity: 0.6;
    }

    .auth-mgmt-link {
        display: block;
        margin-top: 1rem;
        font-size: 0.75rem;
        font-weight: 700;
        color: var(--text-tertiary);
        text-decoration: none;
        letter-spacing: 0.1em;
        transition: all 0.3s ease;
        cursor: pointer;
    }

    .auth-mgmt-link:hover {
        color: var(--navy-900);
        opacity: 1;
    }

    /* Modal Styling for Login Page */
    .auth-modal-overlay {
        position: fixed;
        top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(7, 10, 25, 0.85);
        backdrop-filter: blur(15px);
        display: none;
        align-items: center;
        justify-content: center;
        z-index: 2000;
        animation: fadeIn 0.3s ease;
    }

    .auth-modal {
        background: white;
        border-radius: 24px;
        width: 100%;
        max-width: 450px;
        padding: 3rem;
        box-shadow: 0 40px 100px rgba(0,0,0,0.3);
        animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        text-align: left;
    }

    @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    @keyframes slideUp { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

    .modal-hdr {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-bottom: 2rem;
    }

    .modal-hdr h2 {
        font-family: 'Outfit';
        font-size: 1.25rem;
        font-weight: 800;
        color: var(--navy-900);
        letter-spacing: -0.01em;
    }

    .close-auth-modal {
        background: none;
        border: none;
        font-size: 1.8rem;
        color: var(--text-tertiary);
        cursor: pointer;
        line-height: 1;
    }

    .auth-form-row { margin-bottom: 1.5rem; }
    .auth-form-row label {
        display: block;
        font-size: 0.65rem;
        font-weight: 850;
        color: var(--text-tertiary);
        text-transform: uppercase;
        letter-spacing: 1.5px;
        margin-bottom: 0.6rem;
    }

    .auth-select, .auth-input {
        width: 100%;
        padding: 12px 16px;
        border-radius: 12px;
        border: 1px solid var(--border-light);
        background: var(--surface-light);
        font-family: inherit;
        font-size: 0.9rem;
        font-weight: 600;
        color: var(--navy-900);
        outline: none;
        transition: all 0.2s;
    }

    .auth-select:focus, .auth-input:focus {
        border-color: var(--navy-900);
        box-shadow: 0 0 0 4px rgba(0,0,0,0.03);
    }
</style>

<div class="login-container">
    <div class="login-card" id="loginCard">
        <div class="login-branding">
            <div class="login-logo-pnl" style="background: #ffffff;">
                <img src="{{ url_for('static', filename='css/images/logo.ico') }}" alt="JAI AGENCIES Logo">
            </div>
            <h1 class="login-title">Sign In</h1>
            <p class="login-subtitle">Sales & Inventory System</p>
        </div>

        {% if error %}
        <div class="error-toast" style="background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); padding: 10px 14px; border-radius: 12px; margin-bottom: 1.2rem; font-size: 0.85rem; display: flex; align-items: center; justify-content: center; gap: 8px;">
            <i class="fas fa-exclamation-circle"></i>
            <span>Invalid username or password.</span>
        </div>
        {% endif %}

        <form action="/auth" method="POST">
            <div class="form-control-group">
                <div class="input-wrapper">
                    <input type="text" id="usernameInput" name="username" class="form-input" placeholder="Username" required autocomplete="username" autofocus>
                    <i class="fas fa-user"></i>
                </div>
            </div>

            <div class="form-control-group">
                <div class="input-wrapper">
                    <input type="password" name="password" class="form-input" placeholder="Password" required autocomplete="current-password">
                    <i class="fas fa-lock"></i>
                </div>
            </div>

            <button type="submit" class="btn-authenticate">
                <span>SIGN IN</span>
                <i class="fas fa-arrow-right" style="font-size: 0.85rem;"></i>
            </button>
        </form>

        <div class="login-footer">
            <p>© 2026 JAI AGENCIES</p>
            <a class="auth-mgmt-link" onclick="openAuthModal()">
                <i class="fas fa-key" style="margin-right: 6px;"></i> Change Password
            </a>
        </div>
    </div>
</div>

<!-- Password Change Modal -->
<div class="auth-modal-overlay" id="authModal">
    <div class="auth-modal">
        <div class="modal-hdr">
            <h2>Change Password</h2>
            <button class="close-auth-modal" onclick="closeAuthModal()">&times;</button>
        </div>

        <div class="auth-form-row">
            <label>Select Role</label>
            <select id="update_role" class="auth-select">
                <option value="sales">Sales Executive</option>
                <option value="inventory">Inventory Manager</option>
            </select>
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 1.5rem;">
            <div class="auth-form-row" style="margin-bottom: 0;">
                <label>Current Username</label>
                <input type="text" id="old_user" class="auth-input" placeholder="Current username">
            </div>
            <div class="auth-form-row" style="margin-bottom: 0;">
                <label>Current Password</label>
                <input type="password" id="old_pass" class="auth-input" placeholder="••••••••">
            </div>
        </div>

        <div style="background: rgba(0,0,0,0.06); height: 1px; margin: 1.5rem 0;"></div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 1rem; margin-bottom: 2rem;">
            <div class="auth-form-row" style="margin-bottom: 0;">
                <label>New Username</label>
                <input type="text" id="new_user" class="auth-input" placeholder="New username">
            </div>
            <div class="auth-form-row" style="margin-bottom: 0;">
                <label>New Password</label>
                <input type="password" id="new_pass" class="auth-input" placeholder="New password">
            </div>
        </div>

        <button class="btn btn-primary btn-lg" style="width: 100%; height: 52px; font-weight: 700; background: var(--dash-primary, #6366f1); border: none; border-radius: 14px; color: white; cursor: pointer;" onclick="commitAuthUpdate()">
            Save Changes
        </button>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    const card = document.getElementById('loginCard');
    
    document.addEventListener('mousemove', (e) => {
        const xAxis = (window.innerWidth / 2 - e.pageX) / 45;
        const yAxis = (window.innerHeight / 2 - e.pageY) / 45;
        card.style.transform = `rotateY(${xAxis}deg) rotateX(${yAxis}deg)`;
    });

    document.addEventListener('mouseleave', () => {
        card.style.transition = 'transform 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275)';
        card.style.transform = `rotateY(0deg) rotateX(0deg)`;
        
        setTimeout(() => {
            card.style.transition = 'none';
        }, 600);
    });

    window.onload = () => {
        document.getElementById('usernameInput').focus();
    };

    const authModal = document.getElementById('authModal');
    function openAuthModal() { authModal.style.display = 'flex'; }
    function closeAuthModal() { authModal.style.display = 'none'; }

    async function commitAuthUpdate() {
        const payload = {
            role: document.getElementById('update_role').value,
            old_username: document.getElementById('old_user').value,
            old_password: document.getElementById('old_pass').value,
            new_username: document.getElementById('new_user').value,
            new_password: document.getElementById('new_pass').value
        };

        if (Object.values(payload).some(v => !v)) {
            alert("Please fill in all fields.");
            return;
        }

        try {
            const res = await fetch('/api/auth/update', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });
            const data = await res.json();
            if (data.success) {
                alert("Password updated successfully.");
                location.reload();
            } else {
                alert(data.message || "Failed to update password.");
            }
        } catch (e) {
            alert("Connection error. Please try again.");
        }
    }
</script>
{% endblock %}
